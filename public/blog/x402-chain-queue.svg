<text x="80" y="86" class="mono" font-size="15" letter-spacing="3" fill="#8aa0b8">THE RAIL QUEUE · SEPTEMBER 21–30, 2026</text>
<text x="80" y="130" font-size="26" font-weight="700">Five new ways for an agent to pay. Ten days.</text>

<text x="80" y="196" class="mono" font-size="14" fill="#8aa0b8">SEP 21</text>
<text x="180" y="196" font-size="17">Cardano enters the official x402 SDK — ADA payments for agents</text>

<text x="80" y="266" class="mono" font-size="14" fill="#8aa0b8">SEP 22–24</text>
<text x="180" y="266" font-size="17">Cardano facilitator announced · Algorand ships an x402 kit</text>
<text x="180" y="292" class="mono" font-size="13" fill="#f59e0b">Cardano facilitator still off mainnet — announcement outran the infrastructure</text>

<text x="80" y="362" class="mono" font-size="14" fill="#8aa0b8">SEP 25</text>
<text x="180" y="362" font-size="17" font-weight="700">Block (Jack Dorsey) joins the x402 Foundation</text>
<rect x="168" y="340" width="952" height="38" rx="10" fill="url(#tealfill)" stroke="#2dd4bf" stroke-opacity=".55" stroke-width="1.5"/>
<circle cx="180" cy="359" r="34" fill="url(#glow)" opacity=".8"/>
<text x="1132" y="362" text-anchor="end" class="mono" font-size="13" fill="#2dd4bf">+ Bitcoin Lightning rails</text>

<text x="80" y="432" class="mono" font-size="14" fill="#8aa0b8">SEP 30</text>
<text x="180" y="432" font-size="17">Solana batch settlement for micropayments · Coinbase agent wallets</text>

<text x="80" y="530" font-size="20" font-weight="700" fill="#2dd4bf">Supply arriving faster than demand.</text>
<text x="80" y="562" font-size="16" fill="#e8eef6">Every lane below the line is a chain bidding for the default slot in agent commerce.</text>
<text x="80" y="588" font-size="16" fill="#e8eef6">None of them is a customer.</text>
<text x="80" y="620" class="mono" font-size="13" fill="#8aa0b8">Sources: Blockonomi 9/25 · The Street 9/22 · TradingView 9/21+9/30 · 99Bitcoins 9/22 · CryptoRank 9/23 · AMBCrypto 9/29 · CMC 9/30, 2026</text>

