<text x="80" y="566" font-size="17">They are buying position in the agent economy they expect.</text>
<text x="80" y="620" class="mono" font-size="13" fill="#8aa0b8">Sources: TRM Labs, "Who's Actually Paying" (Sep 2026): $25.62M screened settled value, 0.6–7.5% agentic, ~$5–11K/mo. Rail dates: announcements Sep 21–30, 2026.</text>

