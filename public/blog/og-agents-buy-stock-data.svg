<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">What agents will buy first isn't stocks. It's the data about stocks.</title><desc id="desc">AgentToll article cover: tokenized stock tickers on one side, a paid data call on the other, over a dark grid.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071017"/><stop offset="0.58" stop-color="#06080c"/><stop offset="1" stop-color="#0a1019"/></linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#2dd4bf" stop-opacity=".26"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #e8eef6; }
    .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    .muted { fill: #8b9bb4; } .faint { fill: #5a6b85; } .accent { fill: #2dd4bf; }
  </style>
</defs>
<rect width="100%" height="100%" fill="url(#bg)"/>
<circle cx="180" cy="80" r="260" fill="url(#glow)" opacity=".6"/>
<circle cx="1120" cy="720" r="260" fill="url(#glow)" opacity=".32"/>

<defs>
  <pattern id="og-grid" width="80" height="80" patternUnits="userSpaceOnUse">
    <path d="M80 0H0V80" fill="none" stroke="#174050" stroke-opacity=".42" stroke-width="1"/>
  </pattern>
  <radialGradient id="og-orb-a"><stop stop-color="#2dd4bf" stop-opacity=".42"/><stop offset=".68" stop-color="#2dd4bf" stop-opacity=".12"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
  <radialGradient id="og-orb-b"><stop stop-color="#0ea5e9" stop-opacity=".38"/><stop offset=".7" stop-color="#0ea5e9" stop-opacity=".1"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="630" fill="url(#og-grid)"/>
<circle cx="160" cy="74" r="260" fill="url(#og-orb-a)"/>
<circle cx="1040" cy="570" r="310" fill="url(#og-orb-b)"/>
<circle cx="240" cy="48" r="190" fill="none" stroke="#2dd4bf" stroke-opacity=".16" stroke-width="42"/>
<circle cx="1030" cy="612" r="230" fill="none" stroke="#0ea5e9" stroke-opacity=".13" stroke-width="58"/>
<rect x="70" y="70" width="1060" height="490" rx="30" fill="#050b11" fill-opacity=".96" stroke="#2dd4bf" stroke-width="2"/>

<!-- kicker -->
<text x="120" y="150" class="mono accent" font-size="17" letter-spacing="4">AGENTTOLL.DEV · ANALYSIS · SEPTEMBER 2026</text>

<!-- headline -->
<text x="120" y="220" font-size="48" font-weight="800">What agents will buy first</text>
<text x="120" y="278" font-size="48" font-weight="800">isn't stocks.</text>
<text x="120" y="348" font-size="48" font-weight="800" fill="#2dd4bf">It's the data about stocks.</text>

<!-- subline -->
<text x="120" y="415" class="muted" font-size="20">Tokenized equities landed on Base. Agents already pay cents for data.</text>
<text x="120" y="445" class="muted" font-size="20">The paid information layer is the open gap.</text>

<!-- ticker rail -->
<g class="mono faint" font-size="16">
  <text x="120" y="505">NVDAc</text><text x="205" y="505">METAc</text><text x="290" y="505">AAPLc</text><text x="375" y="505">GOOGLc</text><text x="475" y="505">TSLA</text><text x="550" y="505">MSFT</text>
</g>
<rect x="120" y="8" width="64" height="4" fill="url(#teal)"/>

<!-- paid-call chip, bottom-right -->
<g transform="translate(880 368)">
  <rect x="0" y="0" width="230" height="174" rx="18" fill="#07131c" stroke="#174050" stroke-width="1.5"/>
  <text x="22" y="34" class="mono accent" font-size="15">GET /quote/NVDAc</text>
  <text x="22" y="64" class="mono faint" font-size="14">HTTP 402</text>
  <text x="22" y="86" class="mono" font-size="14" fill="#4ade80">pay 0.003 USDC</text>
  <text x="22" y="114" class="mono" font-size="14" fill="#e8eef6">200 OK + receipt</text>
  <text x="22" y="152" class="mono faint" font-size="13">x402 · Base · 24/5</text>
</g>
</svg>
