<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">The agent payment control plane</title><desc id="desc">A diagram showing policy, discovery, payment protocols, wallets, settlement, and a parallel trace and audit layer.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071017"/><stop offset="0.58" stop-color="#06080c"/><stop offset="1" stop-color="#0a1019"/></linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#2dd4bf" stop-opacity=".26"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #e8eef6; }
    .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    .muted { fill: #8b9bb4; } .faint { fill: #5a6b85; } .accent { fill: #2dd4bf; }
  </style>
</defs>
<rect width="100%" height="100%" fill="url(#bg)"/>
<circle cx="180" cy="80" r="260" fill="url(#glow)" opacity=".6"/>
<circle cx="1120" cy="720" r="260" fill="url(#glow)" opacity=".32"/>
<text x="76" y="66" class="mono accent" font-size="14" letter-spacing="2">AGENT PAYMENT CONTROL PLANE</text>
<text x="76" y="116" font-size="40" font-weight="800">The model proposes. Infrastructure decides.</text>
<text x="76" y="150" class="muted" font-size="18">Payment moved out of tool wrappers and into policy, routing, tracing, and audit.</text>
<rect x="76" y="186" width="760" height="82" rx="18" fill="#101622" fill-opacity=".72" stroke="#2dd4bf" stroke-opacity=".38"/>
<text x="102" y="218" class="mono accent" font-size="12" letter-spacing="1.5">AGENT INTENT</text>
<text x="102" y="247" font-size="21" font-weight="700">"Buy the best result that finishes this task."</text>
<path d="M 456 268 L 456 294" stroke="#2dd4bf" stroke-width="3"/><path d="M 448 286 L 456 296 L 464 286" fill="none" stroke="#2dd4bf" stroke-width="3"/>
<rect x="870" y="186" width="254" height="450" rx="22" fill="#101622" fill-opacity=".68" stroke="#0ea5e9" stroke-opacity=".38"/>
<text x="896" y="224" class="mono" font-size="12" fill="#0ea5e9" letter-spacing="1.5">TRACE / AUDIT</text>
<text x="896" y="266" font-size="18" font-weight="700">What was bought?</text>
<text x="896" y="294" class="muted" font-size="15">Task and tool context</text>
<text x="896" y="340" font-size="18" font-weight="700">Why this seller?</text>
<text x="896" y="368" class="muted" font-size="15">Selection and policy</text>
<text x="896" y="414" font-size="18" font-weight="700">Did it help?</text>
<text x="896" y="442" class="muted" font-size="15">Result, sources, eval</text>
<text x="896" y="488" font-size="18" font-weight="700">Can we prove it?</text>
<text x="896" y="516" class="muted" font-size="15">Receipt and artifact hash</text>
<path d="M 998 546 L 998 594" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="6 6"/>
<circle cx="998" cy="604" r="8" fill="#0ea5e9"/>
<rect x="76" y="300" width="760" height="64" rx="16" fill="#101622" fill-opacity=".66" stroke="#26364d"/>
<circle cx="112" cy="332" r="19" fill="#2dd4bf" fill-opacity=".12" stroke="#2dd4bf" stroke-opacity=".5"/>
<text x="112" y="337" class="mono accent" font-size="11" text-anchor="middle">01</text>
<text x="148" y="327" class="mono" font-size="13" font-weight="700" letter-spacing="1.2">POLICY</text>
<text x="272" y="327" class="muted" font-size="15">recipient · asset · budget · expiry</text>
<text x="148" y="350" class="faint" font-size="13">hard limits outside the prompt</text>
<path d="M 836 332 L 870 332" stroke="#0ea5e9" stroke-opacity=".5" stroke-width="2"/>
<rect x="76" y="378" width="760" height="64" rx="16" fill="#101622" fill-opacity=".66" stroke="#26364d"/>
<circle cx="112" cy="410" r="19" fill="#2dd4bf" fill-opacity=".12" stroke="#2dd4bf" stroke-opacity=".5"/>
<text x="112" y="415" class="mono accent" font-size="11" text-anchor="middle">02</text>
<text x="148" y="405" class="mono" font-size="13" font-weight="700" letter-spacing="1.2">DISCOVERY</text>
<text x="272" y="405" class="muted" font-size="15">relevance · quality · curation</text>
<text x="148" y="428" class="faint" font-size="13">15,100 listings become a shortlist</text>
<path d="M 836 410 L 870 410" stroke="#0ea5e9" stroke-opacity=".5" stroke-width="2"/>
<rect x="76" y="456" width="760" height="64" rx="16" fill="#101622" fill-opacity=".66" stroke="#26364d"/>
<circle cx="112" cy="488" r="19" fill="#2dd4bf" fill-opacity=".12" stroke="#2dd4bf" stroke-opacity=".5"/>
<text x="112" y="493" class="mono accent" font-size="11" text-anchor="middle">03</text>
<text x="148" y="483" class="mono" font-size="13" font-weight="700" letter-spacing="1.2">PAYMENT</text>
<text x="272" y="483" class="muted" font-size="15">x402 + MPP · exact + upto</text>
<text x="148" y="506" class="faint" font-size="13">the protocol becomes an adapter</text>
<path d="M 836 488 L 870 488" stroke="#0ea5e9" stroke-opacity=".5" stroke-width="2"/>
<rect x="76" y="534" width="760" height="64" rx="16" fill="#101622" fill-opacity=".66" stroke="#26364d"/>
<circle cx="112" cy="566" r="19" fill="#2dd4bf" fill-opacity=".12" stroke="#2dd4bf" stroke-opacity=".5"/>
<text x="112" y="571" class="mono accent" font-size="11" text-anchor="middle">04</text>
<text x="148" y="561" class="mono" font-size="13" font-weight="700" letter-spacing="1.2">WALLET</text>
<text x="272" y="561" class="muted" font-size="15">Coinbase · Privy · Cloudflare planned</text>
<text x="148" y="584" class="faint" font-size="13">delegated funds, bounded authority</text>
<path d="M 836 566 L 870 566" stroke="#0ea5e9" stroke-opacity=".5" stroke-width="2"/>
<rect x="76" y="612" width="760" height="64" rx="16" fill="#101622" fill-opacity=".66" stroke="#26364d"/>
<circle cx="112" cy="644" r="19" fill="#2dd4bf" fill-opacity=".12" stroke="#2dd4bf" stroke-opacity=".5"/>
<text x="112" y="649" class="mono accent" font-size="11" text-anchor="middle">05</text>
<text x="148" y="639" class="mono" font-size="13" font-weight="700" letter-spacing="1.2">SETTLEMENT</text>
<text x="272" y="639" class="muted" font-size="15">Base USDC + receipt</text>
<text x="148" y="662" class="faint" font-size="13">value moves and evidence remains</text>
<path d="M 836 644 L 870 644" stroke="#0ea5e9" stroke-opacity=".5" stroke-width="2"/>
<text x="76" y="732" class="mono faint" font-size="12">OPEN PROTOCOLS MOVE VALUE. CONTROL PLANES DECIDE WHEN VALUE MAY MOVE.</text>
<text x="1124" y="732" class="mono accent" font-size="12" text-anchor="end">agenttoll.dev</text>
</svg>