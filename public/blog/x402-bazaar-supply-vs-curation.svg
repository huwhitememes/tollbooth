  <radialGradient id="glow"><stop stop-color="#2dd4bf" stop-opacity=".26"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
